name: qasatly_mohanad
description: نظام إدارة الأقساط والكمبيالات — قساطي مهند
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: LamaSans
      fonts:
        - asset: assets/font/LamaSans-Regular.otf
          weight: 400
        - asset: assets/font/LamaSans-Regular.otf
          weight: 500
        - asset: assets/font/LamaSans-SemiBold.otf
          weight: 600
        - asset: assets/font/LamaSans-Bold.otf
          weight: 700
        - asset: assets/font/LamaSans-Bold.otf
          weight: 800
